<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 터미널</title>
  <style>
    :root { color-scheme: dark; --bg: #0a0f17; --panel: #101a27; --line: #223149; --text: #e6edf7; --muted: #8da0ba; --green: #5ee4a4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #14243a, var(--bg) 55%); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    main { width: min(1100px, calc(100% - 24px)); margin: 12px auto; }
    header { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 14px system-ui, sans-serif; padding: 10px 4px 14px; }
    .dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; box-shadow: 0 0 12px var(--green); }
    .status { margin-left: auto; font-size: 12px; }
    .frame { background: rgba(16, 26, 39, .93); border: 1px solid var(--line); box-shadow: 0 22px 70px rgba(0,0,0,.38); border-radius: 12px; overflow: hidden; }
    .bar { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    #terminal { height: calc(100vh - 116px); min-height: 440px; overflow: auto; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; font-size: 14px; line-height: 1.45; caret-color: var(--green); }
    #terminal:focus { box-shadow: inset 0 0 0 2px rgba(94,228,164,.4); }
    .offline { color: #ffb4a8; }
  </style>
</head>
<body>
  <main>
    <header><span class="dot"></span><strong>웹 터미널</strong><span class="status" id="status">연결 중…</span></header>
    <section class="frame" aria-label="Bash 터미널">
      <div class="bar">Bash · 이 창을 클릭한 뒤 바로 입력하세요</div>
      <div id="terminal" tabindex="0" role="textbox" aria-label="터미널 입력창" aria-multiline="true"></div>
    </section>
  </main>
  <script>
    const terminal = document.getElementById('terminal')
    const status = document.getElementById('status')
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
    const socket = new WebSocket(`${protocol}//${location.host}/terminal`)
    let output = ''

    const render = () => { terminal.textContent = output; terminal.scrollTop = terminal.scrollHeight }
    const send = (message) => { if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message)) }
    const resize = () => send({ type: 'resize', cols: Math.max(20, Math.floor(terminal.clientWidth / 8.4)), rows: Math.max(5, Math.floor(terminal.clientHeight / 20.3)) })

    socket.addEventListener('open', () => { status.textContent = '연결됨'; resize(); terminal.focus() })
    socket.addEventListener('message', (event) => { output += event.data; if (output.length > 180000) output = output.slice(-140000); render() })
    socket.addEventListener('close', () => { status.textContent = '연결이 종료됐어요'; status.classList.add('offline') })
    socket.addEventListener('error', () => { status.textContent = '연결할 수 없어요'; status.classList.add('offline') })
    terminal.addEventListener('keydown', (event) => {
      const key = event.key
      let data = ''
      if (event.ctrlKey && key.length === 1) data = String.fromCharCode(key.toUpperCase().charCodeAt(0) - 64)
      else if (key === 'Enter') data = '\r'
      else if (key === 'Backspace') data = '\u007f'
      else if (key === 'Tab') data = '\t'
      else if (key === 'ArrowUp') data = '\u001b[A'
      else if (key === 'ArrowDown') data = '\u001b[B'
      else if (key === 'ArrowLeft') data = '\u001b[D'
      else if (key === 'ArrowRight') data = '\u001b[C'
      else if (!event.metaKey && !event.altKey && key.length === 1) data = key
      if (data) { event.preventDefault(); send({ type: 'input', data }) }
    })
    terminal.addEventListener('paste', (event) => { const text = event.clipboardData?.getData('text'); if (text) { event.preventDefault(); send({ type: 'input', data: text }) } })
    window.addEventListener('resize', resize)
  </script>
</body>
</html>
