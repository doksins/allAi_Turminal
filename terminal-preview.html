<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALLAI 웹 터미널</title>
<style>
:root{color-scheme:dark;--bg:#0d1310;--panel:#141e18;--line:#2b4233;--accent:#78dba7;--text:#ecf7ef;--muted:#a2b1a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
.shell{height:100dvh;min-height:300px;max-width:1400px;margin:auto;padding:14px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0 0 3px}p{margin:0;color:var(--muted);overflow-wrap:anywhere}
#status{color:var(--accent);font-weight:600}.error{color:#ffa5a5!important}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 12px;background:var(--panel);color:var(--text)}
input{min-width:0;flex:1;max-width:360px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
#connect{background:#244734;color:#d7ffe5}#terminal{padding:10px;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:9px;background:#080d0a}
footer{font-size:12px;color:var(--muted)}.xterm{height:100%}
</style>
</head>
<body><div class="shell">
<header><div><h1>›_ ALLAI 웹 터미널</h1><p id="detail">현재 작업 환경에 연결합니다</p></div><span id="status" role="status">준비 중</span></header>
<form class="controls" id="login"><input type="password" id="token" placeholder="서버 로그의 터미널 토큰" aria-label="터미널 접속 토큰" autocomplete="off" required><button id="connect">연결</button><button id="retry" type="button" disabled>재연결</button><button id="end" type="button" disabled>세션 종료</button></form>
<main id="terminal" aria-label="Bash 터미널"></main>
<footer>WebSocket + HTTP 자동 전환 · 실제 Bash · 종료 전까지 같은 셸 유지 · 30분 미접속 시 세션 정리</footer>
</div>
<script>
'use strict'
const $ = id => document.getElementById(id)
const base = location.pathname.replace(/\/(?:index|terminal-preview)\.html$/, '/').replace(/\/+$/, '')
const service = suffix => base + suffix
let term, fit, token, id, ws, cursor = 0, generation = 0, pollTimer, retryTimer, engine = '', closed = false
let inputQueue = Promise.resolve(), resizeTimer, pollBusy = false
function status(text, error=false) { $('status').textContent=text; $('status').className=error?'error':'' }
function detail(text) { $('detail').textContent=text }
function loadScript(url) {
  return new Promise((resolve,reject) => {
    const script=document.createElement('script');script.src=url;script.onload=resolve;script.onerror=()=>reject(new Error('터미널 라이브러리 로딩 실패: '+url));document.head.append(script)
  })
}
async function init() {
  const css=document.createElement('link');css.rel='stylesheet';css.href=service('/assets/xterm.css');document.head.append(css)
  await loadScript(service('/assets/xterm.js'))
  await loadScript(service('/assets/fit.js'))
  term=new Terminal({cursorBlink:true,scrollback:10000,fontSize:14,theme:{background:'#080d0a',foreground:'#ecf7ef',cursor:'#78dba7'}})
  fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open($('terminal'));fit.fit()
  term.writeln('서버 로그에 표시된 접속 토큰을 입력하세요.')
  term.onData(data=>{
    if(!id||closed)return
    const g=generation
    for(let i=0;i<data.length;) {
      let n=Math.min(i+16000,data.length)
      if(n<data.length&&/[\uD800-\uDBFF]/.test(data[n-1]))n--
      const chunk=data.slice(i,n);i=n
      inputQueue=inputQueue.then(async()=>{
        if(g!==generation||!id||closed)return
        try{await api('input',{method:'POST',data:{data:chunk}})}
        catch(e){if(g===generation){status('입력 전송 실패',true);detail(e.message)}}
      })
    }
  })
  term.onResize(()=>{
    clearTimeout(resizeTimer)
    const g=generation
    resizeTimer=setTimeout(()=>{
      if(g===generation&&id&&!closed)api('resize',{method:'POST',data:size()}).catch(()=>{})
    },150)
  })
  new ResizeObserver(()=>{try{fit.fit()}catch{}}).observe($('terminal'))
  status('접속 토큰 입력')
}
function size(){return {cols:term.cols,rows:term.rows}}
async function api(route,{method='GET',data,query=''}={}) {
  const headers={'X-Terminal-Token':token}
  if(id)headers['X-Terminal-Session']=id
  if(data!==undefined)headers['Content-Type']='application/json'
  const response=await fetch(service('/api/'+route)+query,{method,headers,cache:'no-store',body:data===undefined?undefined:JSON.stringify(data),signal:AbortSignal.timeout(8000)})
  let result
  try{result=await response.json()}catch{throw new Error('HTTP '+response.status+' · 프록시가 API 요청을 전달하지 못했습니다.')}
  if(!response.ok)throw Object.assign(new Error(result.error||'HTTP '+response.status),{code:response.status})
  return result
}
function stopTransport() {
  clearTimeout(pollTimer);clearTimeout(retryTimer)
  const old=ws;ws=null;if(old)old.close()
}
function buttons(active){$('connect').disabled=active;$('retry').disabled=!active;$('end').disabled=!active;$('token').disabled=active}
function finish(message) {
  closed=true;stopTransport();status(message,true);$('retry').disabled=true
}
function apply(data) {
  if(!id||closed)return
  const events=data.events||[]
  if(data.truncated&&events[0]?.seq>cursor+1)term.writeln('\r\n[이전 출력 일부가 생략되었습니다]\r\n')
  for(const event of events)if(event.seq>cursor){term.write(event.data);cursor=event.seq}
  if(data.closed)finish('Bash 종료 ('+(data.exitCode??'?')+')')
}
function schedule(g,delay){clearTimeout(pollTimer);pollTimer=setTimeout(()=>poll(g),delay)}
async function poll(g) {
  if(g!==generation||!id||closed)return
  if(pollBusy){schedule(g,200);return}
  pollBusy=true
  let delay=250
  try{
    const output=await api('output',{query:'?after='+cursor})
    if(g!==generation||closed)return
    apply(output)
    if(!closed){
      const live=ws?.readyState===WebSocket.OPEN
      status(live?'연결됨 · WebSocket':'연결됨 · HTTP')
      delay=live?5000:250
    }
  }catch(e){
    if(g!==generation||closed)return
    if(e.code===404||e.code===401){finish(e.message);return}
    status('재연결 중 · HTTP',true);detail(e.message);delay=1500
  }finally{
    pollBusy=false
    if(g===generation&&id&&!closed)schedule(g,delay)
  }
}
function websocket(g) {
  if(g!==generation||!id||closed)return
  const scheme=location.protocol==='https:'?'wss:':'ws:'
  let socket
  try{socket=new WebSocket(scheme+'//'+location.host+service('/terminal'),['terminal-v1','auth.'+token,'session.'+id,'after.'+cursor])}
  catch{retryTimer=setTimeout(()=>websocket(g),15000);return}
  ws=socket
  const timeout=setTimeout(()=>{if(socket.readyState===WebSocket.CONNECTING)socket.close()},2500)
  socket.onopen=()=>{clearTimeout(timeout);if(ws===socket&&g===generation&&!closed)status('연결됨 · WebSocket')}
  socket.onmessage=e=>{
    if(ws!==socket||g!==generation||closed)return
    try{apply(JSON.parse(e.data))}catch{socket.close()}
  }
  socket.onerror=()=>{clearTimeout(timeout)}
  socket.onclose=()=>{
    clearTimeout(timeout)
    if(ws!==socket||g!==generation||closed)return
    ws=null;status('HTTP 연결로 전환');schedule(g,0)
    retryTimer=setTimeout(()=>websocket(g),15000)
  }
}
$('login').addEventListener('submit',async event=>{
  event.preventDefault()
  if(!term||id)return
  token=$('token').value.trim()
  const g=++generation
  buttons(true);status('Bash 확인 중');closed=false;cursor=0
  try{
    const s=await api('status')
    if(g!==generation)return
    if(!s.bashAvailable)throw new Error('/bin/bash 없음 · apk add bash')
    detail(s.github?.repository?'GitHub 원격: '+s.github.repository:'GitHub 원격 미설정')
    fit.fit()
    const result=await api('session',{method:'POST',data:size()})
    if(g!==generation)return
    id=result.id;engine=result.engine
    $('token').value=''
    detail($('detail').textContent+' · '+engine)
    term.reset();term.focus()
    schedule(g,0);websocket(g)
  }catch(e){if(g===generation){status('연결 실패',true);detail(e.message);buttons(false)}}
})
$('retry').addEventListener('click',()=>{
  if(!id||closed)return
  const g=++generation;stopTransport();status('재연결 중');schedule(g,0);websocket(g);term.focus()
})
$('end').addEventListener('click',async()=>{
  if(!id)return
  try{await api('close',{method:'POST',data:{}})}catch(e){if(e.code!==404){status('세션 종료 실패',true);detail(e.message);return}}
  ++generation;stopTransport();id=null;token=null;closed=false;buttons(false);status('세션 종료됨')
})
$('connect').disabled=true
init().then(()=>$('connect').disabled=false).catch(e=>{status('초기화 실패',true);detail(e.message+' · npm install 확인')})
</script></body></html>
