<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 터미널</title>
  <style>
    :root {
      --color-primary: #78dba7;
      --color-bg: #0d1310;
      --color-surface: #151f19;
      --color-text: #ecf7ef;
      --color-muted: #a2b1a8;
      --color-accent: #253b2d;
      --color-danger: #f5a4a4;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
      --text-sm: 13px; --text-base: 15px; --text-lg: 18px; --text-xl: 24px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--color-text); background: var(--color-bg); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .shell { width: min(1120px, calc(100% - 24px)); min-height: 100vh; margin: 0 auto; padding: var(--space-5) 0; display: grid; grid-template-rows: auto 1fr auto; gap: var(--space-4); }
    header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .brand { display: flex; align-items: center; gap: var(--space-3); font-family: system-ui, sans-serif; }
    .mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #3d7354; border-radius: 12px; background: #183323; color: var(--color-primary); font-weight: 800; }
    h1, p { margin: 0; }
    h1 { font-size: var(--text-lg); letter-spacing: -0.03em; }
    .sub { margin-top: var(--space-1); color: var(--color-muted); font-size: var(--text-sm); }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; background: var(--color-accent); color: var(--color-muted); font: 700 var(--text-sm)/1 system-ui, sans-serif; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #78867d; }
    .status.ready { color: #baf1cf; background: #163223; }
    .status.ready .dot { background: var(--color-primary); box-shadow: 0 0 0 4px rgba(120,219,167,.12); }
    .status.error { color: #ffd0d0; background: #3c2020; }
    .status.error .dot { background: var(--color-danger); }
    main { min-height: 520px; border: 1px solid #2b4233; border-radius: 16px; overflow: hidden; background: #080d0a; box-shadow: 0 18px 54px rgba(0,0,0,.27); }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 46px; padding: 0 var(--space-4); border-bottom: 1px solid #25362b; background: var(--color-surface); font: 700 var(--text-sm)/1 system-ui, sans-serif; }
    .lights { display: flex; gap: 6px; }
    .lights span { width: 10px; height: 10px; border-radius: 50%; background: #3b5242; }
    .bar-label { color: var(--color-muted); }
    #terminal { height: calc(100% - 46px); min-height: 474px; padding: var(--space-4); outline: none; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; caret-color: transparent; font-size: var(--text-base); line-height: 1.55; }
    #terminal:focus { box-shadow: inset 0 0 0 2px rgba(120,219,167,.48); }
    .welcome { color: #bfd1c4; }
    .muted { color: var(--color-muted); }
    .cursor { display: inline-block; width: 9px; height: 18px; margin-left: 2px; vertical-align: -3px; background: var(--color-primary); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    footer { color: var(--color-muted); font: var(--text-sm)/1.5 system-ui, sans-serif; }
    kbd { padding: 2px 6px; border: 1px solid #415447; border-bottom-width: 2px; border-radius: 5px; color: #cfe2d4; background: #18231c; font: 700 11px ui-monospace, monospace; }
    @media (max-width: 640px) { .shell { width: min(100% - 16px, 1120px); padding: var(--space-3) 0; } header { align-items: flex-start; } .status { font-size: 11px; } main { min-height: 420px; } #terminal { min-height: 374px; padding: var(--space-3); font-size: 14px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="mark" aria-hidden="true">›_</div><div><h1>웹 터미널</h1><p class="sub">현재 작업 환경에 연결합니다</p></div></div>
      <div id="status" class="status" role="status"><span class="dot"></span><span>연결 중</span></div>
    </header>
    <main>
      <div class="bar"><div class="lights" aria-hidden="true"><span></span><span></span><span></span></div><span class="bar-label">bash</span></div>
      <div id="terminal" tabindex="0" role="textbox" aria-label="명령 입력 터미널"><span class="welcome">터미널을 준비하고 있습니다…</span><span class="cursor" aria-hidden="true"></span></div>
    </main>
    <footer>명령을 입력하려면 화면을 선택하세요. <kbd>Enter</kbd>로 실행할 수 있습니다.</footer>
  </div>
  <script>
    const terminal = document.getElementById('terminal')
    const status = document.getElementById('status')
    let socket

    const setStatus = (text, state = '') => {
      status.className = `status ${state}`
      status.lastElementChild.textContent = text
    }
    const append = (text) => {
      if (!text) return
      const cursor = terminal.querySelector('.cursor')
      const node = document.createTextNode(text)
      terminal.insertBefore(node, cursor)
      terminal.scrollTop = terminal.scrollHeight
    }
    const connect = () => {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws'
      socket = new WebSocket(`${scheme}://${location.host}/terminal`)
      socket.addEventListener('open', () => {
        terminal.replaceChildren(document.createElement('span'))
        terminal.lastElementChild.className = 'cursor'
        setStatus('연결됨', 'ready')
        terminal.focus()
        socket.send(JSON.stringify({ type: 'resize', cols: 100, rows: 30 }))
      })
      socket.addEventListener('message', (event) => append(event.data))
      socket.addEventListener('close', () => setStatus('연결이 종료됨', 'error'))
      socket.addEventListener('error', () => setStatus('연결할 수 없음', 'error'))
    }
    terminal.addEventListener('keydown', (event) => {
      if (!socket || socket.readyState !== WebSocket.OPEN) return
      const special = { Enter: '\\r', Backspace: '\\x7f', Tab: '\\t', ArrowUp: '\\x1b[A', ArrowDown: '\\x1b[B', ArrowRight: '\\x1b[C', ArrowLeft: '\\x1b[D', Escape: '\\x1b' }
      if (event.key in special) { event.preventDefault(); socket.send(JSON.stringify({ type: 'input', data: special[event.key] })); return }
      if (event.ctrlKey && event.key.length === 1) { event.preventDefault(); socket.send(JSON.stringify({ type: 'input', data: String.fromCharCode(event.key.toUpperCase().charCodeAt(0) - 64) })); return }
      if (!event.metaKey && !event.altKey && event.key.length === 1) { event.preventDefault(); socket.send(JSON.stringify({ type: 'input', data: event.key })) }
    })
    terminal.addEventListener('paste', (event) => {
      if (!socket || socket.readyState !== WebSocket.OPEN) return
      event.preventDefault()
      socket.send(JSON.stringify({ type: 'input', data: event.clipboardData.getData('text') }))
    })
    window.addEventListener('resize', () => socket?.readyState === WebSocket.OPEN && socket.send(JSON.stringify({ type: 'resize', cols: 100, rows: 30 })))
    connect()
  </script>
</body>
</html>
